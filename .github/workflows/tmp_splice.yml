              "vendor/splices/dawe_gpatch/slice.py",
              "vendor/splices/dawe_gpatch/splice.json",
          ]
          for rel in touched:
              entries[rel] = hashlib.sha256(Path(rel).read_bytes()).hexdigest()
          sums_path.write_text("".join(f"{entries[k]}  {k}\n" for k in sorted(entries)), encoding="utf-8")

