          )
          nt_path.write_text(nt, encoding="utf-8")

          shutil.rmtree(".github", ignore_errors=True)

          sums_path = Path("SHA256SUMS")
          entries = {}
          for line in sums_path.read_text(encoding="utf-8").splitlines():
              if "  " in line:
                  digest, rel = line.split("  ", 1)
                  entries[rel] = digest
          touched = [
              "CHANGELOG.md",
              "NOTICE",
              "docs/OPEN-QUESTIONS.md",
              "docs/research/2026-11-17-q2-dawe-gpatch-splice.md",
